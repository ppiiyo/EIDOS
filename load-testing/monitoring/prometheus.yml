global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'eidos-load-test'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # EIDOS API Metrics
  - job_name: 'eidos-api'
    static_configs:
      - targets: ['host.docker.internal:3000', 'host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 5s

  # Node Exporter (CPU, Memory, Disk)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
