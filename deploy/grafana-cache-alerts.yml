groups:
  - name: eidos_redis_cache_alerts
    interval: 30s
    rules:
      - alert: EidosLowCacheHitRate
        expr: eidos_cache_hit_rate < 0.70
        for: 5m
        labels:
          severity: warning
          service: eidos-api
        annotations:
          summary: "EIDOS Redis cache hit rate below 70%"
          description: "Cache hit rate has dropped to {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: EidosHighCacheOperationLatency
        expr: histogram_quantile(0.95, sum(rate(eidos_cache_operation_duration_ms_bucket[5m])) by (le, operation)) > 15
        for: 2m
        labels:
          severity: warning
          service: eidos-api
        annotations:
          summary: "High P95 cache operation latency (>15ms)"
          description: "P95 latency for cache operation {{ $labels.operation }} is {{ $value }}ms."

      - alert: EidosCacheErrorSpike
        expr: sum(rate(eidos_cache_errors_total[5m])) > 1
        for: 1m
        labels:
          severity: critical
          service: eidos-api
        annotations:
          summary: "Redis cache error rate spike detected"
          description: "Redis cache is experiencing errors ({{ $value }} errors/sec) and falling back to InMemoryCache."
