server {
    listen 80;
    server_name eidos-semantic-ideation-platform.ai.studio;
    
    # Security headers на уровне nginx
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # API endpoints - проксируем на Fastify
    location /v1/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Swagger UI
    location /docs {
        proxy_pass http://localhost:4000;
        proxy_set_header Host $host;
    }
    
    # Prometheus metrics
    location /metrics {
        proxy_pass http://localhost:4000;
        # Ограничить доступ к метрикам
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
    
    # SPA fallback для фронтенда
    location / {
        root /var/www/eidos/workspace/dist;
        try_files $uri $uri/ /index.html;
        
        # Cache статических файлов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
