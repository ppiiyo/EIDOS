[build]
  publish = "landing"
  command = "echo 'static landing — no build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/studio"
  to = "https://eidos-demo.vercel.app"
  status = 302

[[redirects]]
  from = "/demo"
  to = "https://eidos-demo.vercel.app"
  status = 302
