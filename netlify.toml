[build]
  publish = "landing"
  command = "echo 'static landing — no build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Browser → same origin → Netlify proxies to long-running API (avoids CORS)
[[redirects]]
  from = "/v1/*"
  to = "https://eidos-semantic-ideation-platform.ai.studio/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "https://eidos-demo.vercel.app"
  status = 302

[[redirects]]
  from = "/demo"
  to = "https://eidos-demo.vercel.app"
  status = 302
