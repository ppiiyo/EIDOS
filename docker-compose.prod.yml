version: '3.9'

# ==============================================================================
# EIDOS v3.5 Production Deployment Stack
# Components: EIDOS API + Redis 7 (AOF) + Prometheus + Grafana + Caddy HTTPS
# ==============================================================================

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: eidos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      eidos-api:
        condition: service_healthy
    networks:
      - eidos-prod

  eidos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eidos-api
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      EIDOS_STRICT_PROD_BOOT: "true"
      EIDOS_MASTER_KEY: ${EIDOS_MASTER_KEY:?EIDOS_MASTER_KEY must be set in production}
      EIDOS_ADMIN_KEY: ${EIDOS_ADMIN_KEY:?EIDOS_ADMIN_KEY must be set in production}
      EIDOS_SEARCH_KEY: ${EIDOS_SEARCH_KEY:-}
      EIDOS_LOG_LEVEL: ${EIDOS_LOG_LEVEL:-info}
      EIDOS_DATA_DIR: /data/db
      EIDOS_SNAPSHOT_PATH: /data/snapshots
      EIDOS_SNAPSHOT_INTERVAL_MS: ${EIDOS_SNAPSHOT_INTERVAL_MS:-3600000}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://search.yourdomain.com}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - eidos_data:/data/db
      - eidos_snapshots:/data/snapshots
      - eidos_models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 2G
    networks:
      - eidos-prod

  redis:
    image: redis:7.2-alpine
    container_name: eidos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    networks:
      - eidos-prod

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: eidos-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - eidos-api
    networks:
      - eidos-prod

  grafana:
    image: grafana/grafana:11.1.0
    container_name: eidos-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - eidos-prod

volumes:
  eidos_data:
  eidos_snapshots:
  eidos_models:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  eidos-prod:
    driver: bridge
