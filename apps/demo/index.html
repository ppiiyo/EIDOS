<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIDOS — Production Semantic Recommender Live Demo</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <header>
    <div class="logo-area">
      <h2 style="font-weight: 700; letter-spacing: -0.02em;">EIDOS</h2>
      <span class="badge">In-Browser Transformers.js (all-MiniLM-L6-v2)</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-recs">Recommendations & Search</button>
      <button class="tab-btn" id="tab-graph">Semantic Graph</button>
    </div>
  </header>

  <main>
    <!-- Left Column: Catalog -->
    <section class="panel" id="catalog-section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.1rem; font-weight: 600;">Product Catalog (100+ Items)</h3>
        <span id="catalog-count" style="font-size: 0.8rem; color: var(--text-muted);">Loading...</span>
      </div>
      <div class="search-bar">
        <input type="text" id="catalog-filter-input" placeholder="Filter catalog list...">
      </div>
      <div class="product-grid" id="catalog-container"></div>
    </section>

    <!-- Right Column: Semantic Results or Graph -->
    <section class="panel" id="results-panel">
      <!-- Recommendations View -->
      <div id="view-recs" style="display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="font-size: 1.1rem; font-weight: 600;">Semantic Affinity Matches</h3>
          <span id="status-tag" class="score-tag">WASM Engine Ready</span>
        </div>

        <div class="search-bar">
          <input type="text" id="semantic-search-input" placeholder="Enter natural language query (e.g., 'ergonomic desk lighting')...">
          <button class="tab-btn" id="btn-search">Search</button>
        </div>

        <div id="recommendations-section" class="product-grid" style="max-height: 520px;"></div>
      </div>

      <!-- Graph View -->
      <div id="view-graph" style="display: none; flex-direction: column; gap: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="font-size: 1.1rem; font-weight: 600;">Semantic Field Topology</h3>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Threshold: 0.55 Cosine</span>
        </div>
        <canvas id="graph-canvas" width="700" height="550"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
