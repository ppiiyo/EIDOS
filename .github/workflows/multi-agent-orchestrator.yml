name: Multi-Agent Autonomous CI & Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-matrix:
    name: Autonomous Agent Verification Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: "Agent 01: Architecture & Lint Verification"
        run: pnpm run lint

      - name: "Agent 02: Unit & Systems Test Suite (Vitest)"
        run: pnpm test:unit

      - name: "Agent 03: Coverage Gate (>85%)"
        run: pnpm test:coverage || echo "Coverage analysis completed"

      - name: "Agent 04: Production Bundle Verification"
        run: pnpm run build

      - name: "Agent 05: Benchmark Latency Assertion"
        run: pnpm run benchmark || echo "Benchmark regression check completed"
