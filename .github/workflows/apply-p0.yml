name: Apply P0 and push if green

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply vector-store diff (no fuzz)
        run: |
          if grep -q "public whenReady()" apps/api/src/services/vector-store.ts; then
            echo "whenReady already present"
          else
            git apply --check patches/vector-store.p0.diff
            git apply patches/vector-store.p0.diff
          fi
      - name: Apply remaining P0 via master script
        run: python3 scripts/apply_master_p0.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - name: typecheck
        run: |
          pnpm --filter @eidos/core exec tsc --noEmit
          pnpm --filter @eidos/api exec tsc --noEmit
          pnpm --filter @eidos/sdk exec tsc --noEmit
      - name: tests
        run: pnpm test
      - name: commit and push only if dirty and green
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "eidos-ci"
          git config user.email "ci@eidos.local"
          git add -A
          git commit -m "fix(p0): VectorStore whenReady + wasEmptyBeforeRestore (caller+callee, CI-gated)"
          git push
