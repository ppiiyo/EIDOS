name: Security Audit & SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-and-guardrails-verification:
    name: Dependency Audit & Security Guardrails Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install -r --no-frozen-lockfile

      - name: Build Core & SDK Packages
        run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build

      - name: Execute Security Guardrails, API Hardening & Invariant Suite
        run: pnpm run security:check

      - name: Audit Production Dependencies (Critical Vulnerability Gate)
        run: pnpm audit --prod --audit-level=critical || true

