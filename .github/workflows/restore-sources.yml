name: Restore API sources

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    # Avoid infinite loop: only run when embedder is broken
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect broken embedder
        id: check
        run: |
          set -euo pipefail
          SIZE=$(wc -c < apps/api/src/services/embedder.ts)
          if grep -q 'PLACEHOLDER' apps/api/src/services/embedder.ts || [ "$SIZE" -lt 1000 ]; then
            echo "broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "broken=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore embedder + apply TS 5.9 fixes
        if: steps.check.outputs.broken == 'true'
        run: |
          set -euo pipefail
          # Last known good embedder before placeholder commits
          git show 2d2366d:apps/api/src/services/embedder.ts > apps/api/src/services/embedder.ts
          python3 - <<'PY'
          from pathlib import Path

          def fix_embedder(p: Path) -> None:
              s = p.read_text(encoding='utf-8')
              s2 = s.replace(
                  'const vec = new Float32Array(output.data);',
                  'const vec = new Float32Array(output.data as ArrayLike<number>);',
                  1,
              )
              s2 = s2.replace(
                  'const vec = new Float32Array(output.data.slice(start, end));',
                  'const vec = new Float32Array(output.data.slice(start, end) as ArrayLike<number>);',
                  1,
              )
              p.write_text(s2, encoding='utf-8')
              print('embedder fixed', s2.count('ArrayLike'))

          def fix_recommend(p: Path) -> None:
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              old = (
                  '.filter((x: { id: string; score: number; embedding: Float32Array } | null): '
                  'x is { id: string; score: number; embedding: Float32Array } => x !== null);'
              )
              new = '.filter((x): x is { id: string; score: number; embedding: Float32Array } => x != null);'
              s2 = s.replace(old, new)
              s2 = s2.replace(
                  'ail.smmr.rerank(smmrPool, data.limit)',
                  'ail.smmr.rerank(smmrPool as { id: string; score: number; embedding: Float32Array }[], data.limit)',
              )
              s2 = s2.replace(
                  'ail.smmr.rerank(smmrPool, limit)',
                  'ail.smmr.rerank(smmrPool as { id: string; score: number; embedding: Float32Array }[], limit)',
              )
              p.write_text(s2, encoding='utf-8')
              print(p, 'as', s2.count('smmrPool as'))

          fix_embedder(Path('apps/api/src/services/embedder.ts'))
          fix_recommend(Path('apps/api/src/routes/recommend.ts'))
          fix_recommend(Path('apps/api/src/routes/recommend-user.ts'))
          PY

      - name: Commit and push
        if: steps.check.outputs.broken == 'true'
        run: |
          git config user.name "eidos-ci"
          git config user.email "ci@eidos.local"
          git add apps/api/src/services/embedder.ts apps/api/src/routes/recommend.ts apps/api/src/routes/recommend-user.ts
          git commit -m "fix(api): restore embedder from 2d2366d + TS5.9 casts"
          git push
