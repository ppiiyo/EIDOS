name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install -r --no-frozen-lockfile

      - name: Build Monorepo Artifacts
        run: |
          pnpm turbo run build
          pnpm run build

      - name: Verify Types, Tests & Benchmarks
        run: |
          pnpm run lint
          pnpm test
          pnpm run benchmark

      - name: Pack Release Tarballs
        run: |
          mkdir -p release-artifacts
          pnpm --filter @eidos/core pack --pack-destination release-artifacts
          pnpm --filter @eidos/sdk pack --pack-destination release-artifacts

      - name: Publish Packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            pnpm publish --filter @eidos/core --access public --no-git-checks
            pnpm publish --filter @eidos/sdk --access public --no-git-checks
          else
            echo "NPM_TOKEN not configured; skipping npm registry publish."
          fi

      - name: Set up Python 3.11 for Python SDK
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build & Test Python SDK (eidos-sdk)
        working-directory: packages/python-sdk
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"
          pytest -v
          python -m build
          cp dist/* ../../release-artifacts/

      - name: Publish Python SDK to PyPI
        working-directory: packages/python-sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            twine upload dist/* --non-interactive --skip-existing
          else
            echo "PYPI_API_TOKEN not configured; skipping PyPI upload."
          fi

      - name: Normalize GHCR Image Owner to Lowercase
        id: ghcr
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push GHCR Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/eidos-api:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/eidos-api:${{ github.ref_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/*
            benchmark-results.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
