name: Auto-apply P0 injects

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inject_*.py'
      - 'scripts/apply_master_p0.py'
      - 'patches/**'
      - '.github/workflows/auto-apply-p0.yml'
  workflow_dispatch:

concurrency:
  group: auto-apply-p0
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip commits already produced by this bot
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, 'apply pending injects'))
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run surgical inject scripts
        id: inject
        run: |
          set -euo pipefail
          applied=0
          failed=0
          for s in inject_when_ready inject_jwt_dev_secret inject_embedder_onnx_flag inject_wal_sync_checkpoint inject_bitrix_delete_hooks inject_demo_mutations_gate inject_fix_security_tests inject_health_redis_optional inject_security_plugin_scope inject_store_default_guard inject_demo_ephemeral inject_metrics_public inject_v35_reindex_status inject_v35_snap_count inject_role_demotion inject_api_key_roles inject_critical_routes_seed inject_docker_compose_port inject_prometheus_seed inject_store_error_json; do
            f="scripts/${s}.py"
            if [ ! -f "$f" ]; then
              echo "skip missing $f"
              continue
            fi
            echo "=== $f ==="
            if out=$(python3 "$f" 2>&1); then
              echo "$out"
              if echo "$out" | grep -qiE 'written|fixed|roles|prefix'; then
                applied=$((applied+1))
              fi
            else
              echo "$out"
              echo "WARN: $f exited non-zero"
              failed=$((failed+1))
            fi
          done
          if [ -f scripts/apply_master_p0.py ]; then
            python3 scripts/apply_master_p0.py || true
          fi
          echo "applied_changes=$applied" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Inject summary: applied=$applied failed=$failed"

      - name: Verify inject markers present
        run: bash scripts/verify_injects.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eidos/core build

      - name: Typecheck API
        run: pnpm --filter @eidos/api exec tsc --noEmit

      - name: Core unit tests (must pass)
        run: |
          mkdir -p data
          export JWT_SECRET="test-jwt-secret-at-least-24chars!!"
          export VITEST=1 NODE_ENV=test EIDOS_ONNX_EMBEDDER=false
          pnpm exec vitest run \
            apps/api/tests/phase1-api-hardening.test.ts \
            apps/api/tests/p0-registry-restart.test.ts \
            apps/api/tests/v35-production-gate.test.ts \
            tests/integration/critical-routes.test.ts \
            tests/integration/prometheus-metrics.test.ts \
            tests/security/p0-regression.test.ts \
            tests/unit/store-registry.test.ts \
            tests/multi-tenancy/tenant-isolation.test.ts

      - name: Commit applied injects
        run: |
          if git diff --quiet; then
            echo "Tree clean — injects already applied"
            exit 0
          fi
          git config user.name eidos-ci
          git config user.email ci@eidos.local
          git add -A
          git commit -m "fix: apply pending injects (auto)"
          git push
