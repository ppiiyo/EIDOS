name: Auto-apply VectorStore P0 on push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-whenReady:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Surgical injects
        run: |
          set -e
          for s in inject_when_ready inject_jwt_dev_secret inject_embedder_onnx_flag inject_wal_sync_checkpoint inject_bitrix_delete_hooks inject_demo_mutations_gate inject_fix_security_tests inject_health_redis_optional; do
            f="scripts/${s}.py"
            if [ -f "$f" ]; then python3 "$f" || true; fi
          done
          if [ -f scripts/apply_master_p0.py ]; then python3 scripts/apply_master_p0.py || true; fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eidos/core build
      - name: typecheck api
        run: pnpm --filter @eidos/api exec tsc --noEmit
      - name: unit tests (report)
        run: pnpm test
        continue-on-error: true
      - name: commit if dirty
        run: |
          if git diff --quiet; then echo clean; exit 0; fi
          git config user.name eidos-ci
          git config user.email ci@eidos.local
          git add -A
          git commit -m "fix: apply pending injects (health redis optional, security tests)"
          git push
