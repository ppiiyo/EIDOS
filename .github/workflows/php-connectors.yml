name: PHP Connectors

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint-autoload:
    name: PHP lint + Bitrix autoload resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find packages/connectors connectors -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify agent/event classes resolve via include.php
        run: php scripts/verify-bitrix-autoload.php

      - name: PHPUnit
        run: |
          set -e
          for d in connectors/bitrix connectors/woocommerce packages/connectors/bitrix packages/connectors/woocommerce; do
            if [ -f "$d/composer.json" ]; then (cd "$d" && composer install --no-interaction --prefer-dist && ./vendor/bin/phpunit); fi
          done
