name: PHP Connectors

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint-autoload:
    name: PHP lint + Bitrix autoload resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, dom, libxml, xmlwriter, tokenizer, filter
          coverage: none
          tools: composer:v2

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find packages/connectors connectors -name '*.php' -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 0
          fi
          for f in "${files[@]}"; do
            php -l "$f"
          done

      - name: Verify agent/event classes resolve via include.php
        run: php scripts/verify-bitrix-autoload.php

      - name: PHPUnit (packages with composer.json)
        run: |
          set -euo pipefail
          found=0
          for d in packages/connectors/bitrix packages/connectors/woocommerce connectors/bitrix connectors/woocommerce; do
            if [ -f "$d/composer.json" ]; then
              found=1
              echo "::group::$d"
              (
                cd "$d"
                composer install --no-interaction --prefer-dist --no-progress
                if [ -d tests ] || [ -d test ]; then
                  ./vendor/bin/phpunit --colors=always
                else
                  echo "No tests/ directory — nothing to run"
                fi
              )
              echo "::endgroup::"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No connector composer.json found"
            exit 1
          fi
