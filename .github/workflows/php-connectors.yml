name: PHP Connectors

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint-autoload:
    name: PHP lint + Bitrix autoload resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find packages/connectors connectors -name '*.php' -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found under packages/connectors or connectors"
            exit 1
          fi
          printf '%s\0' "${files[@]}" | xargs -0 -n1 php -l

      - name: Verify agent/event classes resolve via include.php
        run: php scripts/verify-bitrix-autoload.php
