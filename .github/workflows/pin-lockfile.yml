name: Pin lockfile

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/lockfile.part*.b64'
      - 'scripts/restore_pnpm_lock.py'
      - 'package.json'
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pin-lockfile
  cancel-in-progress: true

jobs:
  pin:
    name: Restore and commit pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Restore lockfile from parts (or regenerate)
        run: |
          set -euo pipefail
          if [ -f scripts/restore_pnpm_lock.py ] && ls scripts/lockfile.part*.b64 >/dev/null 2>&1; then
            python3 scripts/restore_pnpm_lock.py
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Verify Fastify 4 swagger pin
        run: |
          set -euo pipefail
          grep -q "@fastify/swagger@8" pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm list @fastify/swagger | grep -E '8\.'
      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          git config user.name "eidos-ci"
          git config user.email "ci@eidos.local"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already up to date"
          else
            git commit -m "chore(lockfile): pin deps for @fastify/swagger@8 (Fastify 4)"
            git push origin HEAD:main
          fi
