name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITEST: '1'
  NODE_ENV: test
  EIDOS_API_KEY: ci-test-secret-key-at-least-32-chars-long
  JWT_SECRET: test-jwt-secret-at-least-24chars!!
  EIDOS_EMBEDDING_MODE: deterministic
  EIDOS_EMBEDDER_MODE: deterministic
  CORS_ORIGIN: http://localhost:3000

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify zero Python mutation scripts in scripts/
        run: |
          if ls scripts/*.py 2>/dev/null; then
            echo "FATAL: CI mutation scripts in scripts/ are forbidden."
            exit 1
          fi

      - name: Build @eidos/core and @eidos/sdk
        run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build

      - name: Typecheck & Lint all workspaces
        run: pnpm lint

      - name: Verify UI hardcoded API keys guard
        run: bash scripts/check-ui-keys.sh

      - name: Build all workspaces (@eidos/core, @eidos/sdk, @eidos/api, @eidos/workspace)
        run: pnpm run build

  unit-tests:
    name: Full test suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build @eidos/core and @eidos/sdk
        run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build

      - name: Run full test suite
        run: mkdir -p data && pnpm test

      - name: Coverage (@eidos/core)
        if: matrix.node-version == 20
        run: pnpm exec vitest run --coverage packages/core/src/tests

  php-connectors:
    name: PHP 8.2 Connectors (Syntax + Autoload + PHPUnit + Pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpunit

      - name: Lint all PHP files
        run: |
          find connectors packages/connectors -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify Bitrix include.php autoload
        run: php scripts/verify-bitrix-autoload.php

      - name: Run Bitrix PHPUnit suite & verify connector packagers
        run: |
          cd packages/connectors/bitrix && composer install --no-interaction && vendor/bin/phpunit tests/ConnectorTest.php
          cd ../../..
          bash connectors/bitrix/pack.sh
          bash connectors/woocommerce/pack.sh

  python-sdk:
    name: Python 3.11 SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Test Python SDKs
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e "./packages/sdk/python[dev]"
          pytest packages/sdk/python/tests
          pip install -e "./packages/python-sdk[dev]"
          pytest packages/python-sdk/tests
