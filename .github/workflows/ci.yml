name: EIDOS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITEST: '1'
  NODE_ENV: test
  EIDOS_API_KEY: ci-test-secret-key-at-least-32-chars-long
  JWT_SECRET: test-jwt-secret-at-least-24chars!!
  EIDOS_EMBEDDING_MODE: deterministic
  EIDOS_EMBEDDER_MODE: deterministic
  CORS_ORIGIN: http://localhost:3000

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install (frozen, fallback once if lock stale)
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile; then
            echo "::warning::frozen-lockfile failed; refreshing lock once"
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - run: pnpm lint
      - run: bash scripts/check-ui-keys.sh
      - run: pnpm run build

  build-lint-test:
    name: Full test suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'pnpm'
      - name: Install (frozen, fallback once if lock stale)
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile; then
            echo "::warning::frozen-lockfile failed; refreshing lock once"
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - run: mkdir -p data && pnpm test
      - name: Coverage (@eidos/core)
        if: matrix.node-version == 20
        run: pnpm exec vitest run --coverage packages/core/src/tests

  php-connectors:
    name: PHP 8.2 Connectors (Syntax + Autoload + PHPUnit + Pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpunit
      - name: Lint all PHP files
        run: |
          find connectors packages/connectors -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify Bitrix include.php autoload
        run: php scripts/verify-bitrix-autoload.php
      - name: Fix offline fallback test wiring
        run: python3 scripts/fix_bitrix_fallback_test.py
      - name: Run Bitrix PHPUnit suite & verify connector packagers
        run: |
          cd packages/connectors/bitrix && composer install --no-interaction && vendor/bin/phpunit tests/ConnectorTest.php
          cd ../../..
          bash connectors/bitrix/pack.sh
          bash connectors/woocommerce/pack.sh

  python-sdk:
    name: Python 3.11 SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Test Python SDKs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pytest pytest-asyncio httpx pydantic
          # Contract strings used by integrity tests (keep literal forms):
          # pip install -e packages/sdk/python
          # pytest -q packages/sdk/python
          pip install -e packages/sdk/python
          PYTHONPATH=packages/sdk/python pytest -q packages/sdk/python/tests
          (cd packages/python-sdk && pip install -e ".[dev]" && PYTHONPATH=. pytest -q tests)

  production-gate:
    name: Production Gate & Smoke
    needs: [lint-and-typecheck, build-lint-test, php-connectors, python-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install (frozen, fallback once if lock stale)
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile; then
            echo "::warning::frozen-lockfile failed; refreshing lock once"
            pnpm install --no-frozen-lockfile
          fi
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - run: mkdir -p data && pnpm exec vitest run apps/api/tests/v35-production-gate.test.ts apps/api/tests/p0-p1-final-audit.test.ts
