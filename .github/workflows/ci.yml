name: EIDOS CI Pipeline
on:
  push: { branches: [main, master] }
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  JWT_SECRET: test-jwt-secret-at-least-24chars!!
  VITEST: '1'
  NODE_ENV: test
  EIDOS_EMBEDDING_MODE: deterministic   # быстро и детерминированно для unit
  CORS_ORIGIN: http://localhost:3000
jobs:
  build-lint-test:
    name: Build, Lint, Test & Coverage
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { node-version: [20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node-version }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - run: pnpm lint
      - run: mkdir -p data && pnpm test
      - name: Coverage (core)
        if: matrix.node-version == 20
        run: pnpm exec vitest run --coverage packages/core/src/tests
      - run: pnpm --filter @eidos/workspace build
  php-connectors:
    name: PHP 8.2 Connectors (Syntax + Autoload + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none, tools: composer:v2 }
      - run: find packages/connectors connectors -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php scripts/verify-bitrix-autoload.php
      - name: PHPUnit
        run: |
          set -e
          for d in connectors/bitrix connectors/woocommerce packages/connectors/bitrix packages/connectors/woocommerce; do
            if [ -f "$d/composer.json" ]; then (cd "$d" && composer install --no-interaction --prefer-dist && ./vendor/bin/phpunit); fi
          done
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then composer install --no-interaction && ./vendor/bin/phpunit; fi
  python-sdk:
    name: Python 3.11 SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip pytest
      - run: pip install -e packages/sdk/python
      - run: pytest -q packages/sdk/python
  production-gate:
    runs-on: ubuntu-latest
    needs: [build-lint-test, php-connectors, python-sdk]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "CI gate passed for ${{ github.sha }}"
