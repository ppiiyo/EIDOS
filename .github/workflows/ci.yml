name: EIDOS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: test
      EIDOS_API_KEY: ci-test-secret-key-at-least-32-chars-long
      JWT_SECRET: ci-jwt-secret-key-at-least-32-chars-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify zero Python mutation scripts in scripts/
        run: |
          if ls scripts/*.py 2>/dev/null; then
            echo "FATAL: CI mutation scripts in scripts/ are forbidden."
            exit 1
          fi

      - name: Typecheck & Lint
        run: pnpm run lint

      - name: Verify UI hardcoded API keys guard
        run: bash scripts/check-ui-keys.sh

      - name: Build all workspaces (@eidos/core, @eidos/sdk, @eidos/api, @eidos/workspace)
        run: pnpm run build

      - name: Run Unit, Integration & Security Tests
        run: pnpm test

      - name: Run @eidos/core Coverage Gate
        run: pnpm run test:coverage

  php-connectors:
    name: PHP 8.2 Connectors (Syntax + Autoload + PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpunit
      - name: Lint all PHP files
        run: |
          find connectors packages/connectors -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify Bitrix include.php autoload
        run: php scripts/verify-bitrix-autoload.php
      - name: Run Bitrix & WooCommerce PHPUnit suites
        run: |
          cd connectors/bitrix && composer install --no-interaction && vendor/bin/phpunit
          cd ../woocommerce && composer install --no-interaction && vendor/bin/phpunit

  python-sdk:
    name: Python 3.11 SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Test Python SDK
        run: |
          pip install -e "./packages/sdk/python[dev]"
          pytest packages/sdk/python/tests
