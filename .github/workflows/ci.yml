name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: test-jwt-secret-at-least-24chars!!
  VITEST: '1'
  NODE_ENV: test
  EIDOS_ONNX_EMBEDDER: 'false'
  CORS_ORIGIN: http://localhost:3000

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build
      - name: Typecheck workspaces
        run: |
          pnpm --filter @eidos/core exec tsc --noEmit
          pnpm --filter @eidos/sdk exec tsc --noEmit
          pnpm --filter @eidos/api exec tsc --noEmit

  unit-tests:
    name: Full test suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build
      - name: Apply product + acceptance injects
        run: |
          set -euo pipefail
          for s in scripts/inject_*.py; do
            echo "=== $s ==="
            python3 "$s"
          done
      - name: Verify inject markers
        run: bash scripts/verify_injects.sh
      - name: Run full Vitest suite
        run: |
          mkdir -p data
          pnpm test
      - name: Coverage thresholds (packages/core only)
        if: matrix.node-version == 20
        run: |
          mkdir -p data
          pnpm exec vitest run --coverage packages/core/src/tests

  php-connectors:
    name: PHP connectors lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find packages/connectors connectors -name '*.php' -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then echo "No PHP files"; exit 1; fi
          printf '%s\0' "${files[@]}" | xargs -0 -n1 php -l
      - name: Bitrix autoload
        run: |
          if [ -f scripts/verify-bitrix-autoload.php ]; then
            php scripts/verify-bitrix-autoload.php
          fi

  python-sdk-tests:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pytest
        run: |
          pip install pytest -q
          if [ -d packages/sdk/python ]; then
            pip install -e packages/sdk/python -q
            pytest -q packages/sdk/python
          elif [ -d packages/python-sdk ]; then
            pip install -e packages/python-sdk -q
            pytest -q packages/python-sdk
          else
            echo "No Python SDK package"
            exit 0
          fi

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - name: Build workspace UI
        run: pnpm --filter @eidos/workspace build
      - name: Verify artifacts
        run: |
          test -s packages/core/dist/index.js
          test -s packages/core/dist/index.d.ts
          test -s packages/sdk/dist/index.js
          test -s packages/sdk/dist/index.d.ts

  production-gate:
    name: Production gate
    runs-on: ubuntu-latest
    needs: [build, php-connectors]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "CI production gate passed for ${{ github.sha }}"
