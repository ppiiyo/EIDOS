name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install -r --no-frozen-lockfile

      - name: Build Core & SDK Declarations
        run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build

      - name: TypeScript Verification Across All Workspaces
        run: |
          pnpm run lint
          pnpm turbo run lint

  unit-tests:
    name: Unit & Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install -r --no-frozen-lockfile

      - name: Build Core & SDK Packages
        run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build

      - name: Run Test Suite & Enforce Coverage Gate (>80%)
        if: matrix.node-version == 20
        run: pnpm run test:coverage

      - name: Run Test Suite (Node 22)
        if: matrix.node-version != 20
        run: pnpm test

      - name: Run Real-World Algorithmic Integration Suite
        run: pnpm run test:integration

      - name: Upload Coverage Artifact
        if: matrix.node-version == 20 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  python-sdk-tests:
    name: Python SDK (eidos-sdk) Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python SDK & Run Pytest
        working-directory: packages/python-sdk
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
          pytest -v
          python -m build

  build:
    name: Build Monorepo & Verify Artifacts
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, python-sdk-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache Turborepo Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**', 'apps/**/src/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install & Verify Workspace Dependencies
        run: |
          pnpm install -r --no-frozen-lockfile
          pnpm --filter @eidos/core list --depth 0

      - name: Build Monorepo with Turbo
        run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build
          pnpm turbo run build
          pnpm run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Verify Compiled Artifacts
        run: |
          test -s packages/core/dist/index.js
          test -s packages/core/dist/index.d.ts
          test -s packages/sdk/dist/index.js
          test -s packages/sdk/dist/index.d.ts
          test -s apps/api/dist/server.js
          test -s dist/index.html

  e2e-tests:
    name: E2E Integration Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install -r --no-frozen-lockfile

      - name: Build Core & SDK Packages
        run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Full E2E Pipeline
        run: pnpm test:e2e

  load-test:
    name: k6 Load Test Validation (Baseline)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies & Build
        run: |
          pnpm install -r --no-frozen-lockfile
          pnpm run build

      - name: Start Server in Background
        run: |
          pnpm start &
          sleep 5

      - name: Run Baseline Load Test
        run: |
          node load-testing/scripts/run-baseline.mjs
          chmod +x load-testing/scripts/analyze-results.sh
          ./load-testing/scripts/analyze-results.sh

      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-testing/results/
          retention-days: 14

  deploy:
    name: Production Deployment Gate
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, load-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Gate Notification
        run: |
          echo "✅ All verification gates passed. Ready for production release."
