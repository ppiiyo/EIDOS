name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: test-jwt-secret-at-least-24chars!!
  VITEST: '1'
  NODE_ENV: test
  EIDOS_ONNX_EMBEDDER: 'false'
  CORS_ORIGIN: http://localhost:3000

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build core & sdk
        run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build
      - name: Typecheck (explicit workspaces)
        run: |
          pnpm --filter @eidos/core exec tsc --noEmit
          pnpm --filter @eidos/sdk exec tsc --noEmit
          pnpm --filter @eidos/api exec tsc --noEmit

  unit-tests:
    name: Core tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm --filter @eidos/core build
          pnpm --filter @eidos/sdk build
      - name: Core production gate tests
        run: |
          mkdir -p data
          pnpm run test:core
      - name: Full suite (report only)
        if: matrix.node-version == 20
        continue-on-error: true
        run: |
          mkdir -p data
          pnpm test
      - name: Coverage on core packages (report only)
        if: matrix.node-version == 20
        continue-on-error: true
        run: pnpm run test:coverage

  php-connectors:
    name: PHP connectors lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find packages/connectors connectors -name '*.php' -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          printf '%s\0' "${files[@]}" | xargs -0 -n1 php -l
      - name: Bitrix autoload
        run: |
          if [ -f scripts/verify-bitrix-autoload.php ]; then
            php scripts/verify-bitrix-autoload.php
          else
            echo "verify-bitrix-autoload.php missing — skip"
          fi

  inject-markers:
    name: Verify inject markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify_injects.sh

  python-sdk-tests:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pytest (best-effort paths)
        run: |
          set +e
          pip install pytest -q
          if [ -d packages/sdk/python ]; then
            pip install -e packages/sdk/python -q
            pytest -q packages/sdk/python && exit 0
          fi
          if [ -d packages/python-sdk ]; then
            pip install -e packages/python-sdk -q
            pytest -q packages/python-sdk && exit 0
          fi
          echo "No Python SDK package with tests — skip"
          exit 0

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, inject-markers]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eidos/core build && pnpm --filter @eidos/sdk build
      - name: Build workspace UI
        run: pnpm --filter @eidos/workspace build || pnpm exec vite build --config apps/workspace/vite.config.ts
      - name: Verify artifacts
        run: |
          test -s packages/core/dist/index.js
          test -s packages/core/dist/index.d.ts
          test -s packages/sdk/dist/index.js
          test -s packages/sdk/dist/index.d.ts
          test -s dist/index.html || test -s apps/workspace/dist/index.html || echo "UI dist optional in CI"

  production-gate:
    name: Production gate
    runs-on: ubuntu-latest
    needs: [build, php-connectors]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "CI production gate passed for ${{ github.sha }}"
          echo "Required: typecheck + test:core + inject markers + build + PHP lint"
