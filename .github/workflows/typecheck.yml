name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eidos/core build
      - run: pnpm --filter @eidos/sdk build
      - name: tsc core
        run: pnpm --filter @eidos/core exec tsc --noEmit
      - name: tsc sdk
        run: pnpm --filter @eidos/sdk exec tsc --noEmit
      - name: tsc api
        run: pnpm --filter @eidos/api exec tsc --noEmit
