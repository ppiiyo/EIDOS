name: 💡 Feature Request
description: Suggest an idea or enhancement for EIDOS
title: '[Feature]: '
labels: ['enhancement', 'discussion']
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature proposals and mathematical/algorithmic improvements!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Algorithm
      description: Describe the solution or recommendation architecture you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative libraries or designs you've looked into.
    validations:
      required: false
