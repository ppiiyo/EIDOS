name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior in EIDOS
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are running the latest version of EIDOS before filing.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When calling /v1/recommend with...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal reproducible code sample.
      placeholder: |
        1. Ingest item with ID...
        2. Execute POST /v1/recommend with payload...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Core Engine (@eidos/core)
        - Fastify API Microservice (@eidos/api)
        - Client SDK (@eidos/sdk)
        - WebAssembly In-Browser Demo
        - Adaptive Intelligence Layer (AIL)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Node.js version, package manager.
      placeholder: Linux x86_64, Node.js 20.11, pnpm 9.1
    validations:
      required: false
