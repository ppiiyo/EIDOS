version: '3.9'

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - EIDOS_DOMAIN=${EIDOS_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eidos_net

  api:
    image: eidos/eidos:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "3000:8080"
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - EIDOS_STRICT_PROD_BOOT=true
      - EIDOS_TRUST_PROXY=true
      - EIDOS_MASTER_KEY=${EIDOS_MASTER_KEY:?Set EIDOS_MASTER_KEY in .env (min 24 chars)}
      - EIDOS_ADMIN_KEY=${EIDOS_ADMIN_KEY:-}
      - EIDOS_SEARCH_KEY=${EIDOS_SEARCH_KEY:-}
      - EIDOS_PUBLIC_DEMO_KEY=${EIDOS_PUBLIC_DEMO_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (min 24 chars)}
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
      - EIDOS_DATA_DIR=/app/data/db
      - EIDOS_SNAPSHOT_PATH=/app/data/catalog.snapshot.json
      - EIDOS_WAL_PATH=/app/data/catalog.wal.jsonl
    volumes:
      - eidos_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eidos_net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eidos_net

volumes:
  eidos_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  eidos_net:
    driver: bridge
