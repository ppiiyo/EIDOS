version: '3.8'

# All-in-One EIDOS deployment (REST API /v1/* + Studio UI + Embedded RESP2 Redis in a single container)
# Quick start:
#   docker run -p 3000:3000 eidos/eidos
#   or:
#   docker compose up -d

services:
  eidos:
    image: eidos/eidos:latest
    container_name: eidos
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EIDOS_PORT=3000
      - EIDOS_API_KEY=${EIDOS_API_KEY:-dev-key-min-32-chars}
      - EIDOS_PUBLIC_DEMO_KEY=${EIDOS_PUBLIC_DEMO_KEY:-eidos_demo_key}
      - AIL_ENABLED=true
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379}
      - CACHE_TTL_SECONDS=300
    volumes:
      - eidos-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      eidos:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["monitoring"]
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  eidos-data:
  prometheus-data:
  grafana-data:
